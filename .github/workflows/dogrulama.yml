name: dogrulama

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Haftalık tam tarama — ölü linkler sessizce birikmesin
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bicim:
    name: Biçim kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tüm biçim kuralları tek yerde: araclar/bicim-denetle.py.
      # Denetleyici, girdi sözleşmesini site üretecinin okuduğu aynı
      # dosyadan (araclar/bicim.py) alır — böylece "CI'dan geçti ama
      # sitede görünmedi" durumu oluşamaz.
      # Yerelde aynı komutla koşturulabilir.
      - name: Biçim denetimi
        run: python3 araclar/bicim-denetle.py

  # Ölü link taraması, üçüncü parti sitelerin bot koruması ve coğrafi
  # kısıtları yüzünden doğası gereği kırılgan: canlı bir adres runner'ın
  # ağından "connection failed" dönebiliyor. Bu yüzden tarama iki kipte
  # çalışır:
  #   - push / PR   → bilgi amaçlı, katkıcıyı BLOKLAMAZ (fail: false)
  #   - zamanlanmış → yetkili koşu, kırılırsa issue açar
  # Katkıcının kendi işine dair deterministik kontroller (biçim, etiket,
  # META kaydı) yukarıdaki "bicim" job'unda ve orası bloklayıcıdır.
  linkler:
    name: Ölü link taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hariç tutulanlar. Kural: bir adres yalnızca ELLE doğrulanıp gerçekten
      # canlı olduğu görüldüğünde ve hata bot korumasından/coğrafi farktan
      # kaynaklandığında buraya eklenir. Gerçekten ölü linkler listeden
      # çıkarılır, buraya gizlenmez.
      #
      # - resmigazete.gov.tr: Türkiye'den anında açılıyor, GitHub'ın ABD
      #   runner'larından zaman aşımına uğruyor (coğrafi erişim farkı).
      # - orca.security/.../vector-database-security-risks: çerez atmak için
      #   bir kez 302 döndürüyor; çerez tutan istemcide 200. lychee çerez
      #   tutmadığı için sonsuz yönlendirme görüyor (5 Ağu 2026'da elle teyit).
      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 4
            --timeout 45
            --accept 200,206,403,429
            --exclude-path ./site
            --exclude 'resmigazete\.gov\.tr'
            --exclude 'orca\.security/resources/blog/vector-database-security-risks'
            './**/*.md'
          fail: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          output: lychee.md

      - name: Rapor özeti
        if: always()
        run: cat lychee.md >> "$GITHUB_STEP_SUMMARY" || true

      # push/PR'da bulunan sorunları uyarı olarak yüzeye çıkar — bloklamadan.
      - name: Bulunan sorunları uyarı olarak bildir
        if: success() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          if grep -qE '^\* \[(ERROR|[0-9]{3})\]|^\* \[TIMEOUT\]' lychee.md 2>/dev/null; then
            echo "::warning::Ölü link taraması sorun buldu — ayrıntı için iş özetine bakın. Bu kontrol push/PR'da bloklamaz; haftalık zamanlanmış tarama yetkilidir."
            grep -E '^\* \[' lychee.md | head -20
          else
            echo "Tüm linkler erişilebilir."
          fi

      # Zamanlanmış taramada kırık link bulunursa issue aç.
      - name: Kırık link issue'su
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Ölü link taraması başarısız'
          content-filepath: lychee.md
          labels: bakim, olu-link
